<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>finally, you found me!</title>
  <meta name="description" content="Manav Chaudhari — Currently building my new portfolio.">
  <meta name="theme-color" content="#000000">

  <!-- Favicons -->
  <link id="favicon" rel="icon" type="image/png" sizes="192x192" href="./active.png?v=14">
  <link rel="apple-touch-icon" sizes="180x180" href="./active.png?v=14">
  <link rel="preload" as="image" href="./inactive.png?v=14">
  <link rel="preload" as="image" href="./avatar-sheet.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card-bg: #0A0A0C;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);

      --fg: #EDEDED;
      --fg-muted: #888888;
      --fg-faint: #444444;

      --accent: #E5A93C;

      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", monospace;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Centered Minimalist Unit */
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* Meta Bar */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 13.5px;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      font-weight: 500;
      cursor: default;
    }

    /* 8-Way Sprite Avatar */
    .brand-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      /* border: 1px solid var(--border); */
      overflow: hidden;
      flex-shrink: 0;
      background-color: var(--card-bg);
      background-image: url("./idle.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .brand-avatar.sprite-ready {
      background-image: url("avatar-sheet.png");
      background-size: 300% 300%;
      background-position: 50% 50%;
    }


    /* Spider-Verse Name Glitch Effect */
    .brand-name {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      position: relative;
    }

    .glitch-word {
      position: relative;
      display: inline-block;
      will-change: transform, filter;
    }

    .glitch-word::before,
    .glitch-word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    /* Mode 1: Horizontal Slice Shear + CMY Ghost */
    .glitch-word.glitch-slice {
      color: transparent;
      animation: g-slice-base 360ms steps(1, end) forwards;
    }

    .glitch-word.glitch-slice::before {
      color: var(--fg);
      opacity: 1;
      clip-path: inset(0 0 48% 0);
      animation: g-slice-top 360ms steps(1, end) forwards;
    }

    .glitch-word.glitch-slice::after {
      color: var(--fg);
      opacity: 1;
      clip-path: inset(52% 0 0 0);
      animation: g-slice-bot 360ms steps(1, end) forwards;
    }

    @keyframes g-slice-base {

      0%,
      45% {
        color: transparent;
      }

      55% {
        color: var(--fg);
        text-shadow: -2.5px 1px 0 #00f0ff, 2.5px -1px 0 #ff0080, 0 2px 0 #ffe600;
      }

      80% {
        color: var(--fg);
        text-shadow: 1.5px -1px 0 #00f0ff, -1.5px 1px 0 #ff0080;
      }

      100% {
        color: var(--fg);
        text-shadow: none;
      }
    }

    @keyframes g-slice-top {
      0% {
        transform: translate(-3px, -1.5px);
        color: var(--fg);
        opacity: 1;
      }

      30% {
        transform: translate(2.5px, -1px) skewX(-6deg);
        color: #00f0ff;
        opacity: 1;
      }

      55% {
        transform: translate(-2px, 1px);
        color: #ff0080;
        opacity: 0.85;
        clip-path: inset(0 0 0 0);
        mix-blend-mode: screen;
      }

      85%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-slice-bot {
      0% {
        transform: translate(3.5px, 1.5px);
        color: var(--fg);
        opacity: 1;
      }

      30% {
        transform: translate(-2.5px, 1px) skewX(6deg);
        color: #ffe600;
        opacity: 1;
      }

      55% {
        transform: translate(2px, -1px);
        color: #00f0ff;
        opacity: 0.85;
        clip-path: inset(0 0 0 0);
        mix-blend-mode: screen;
      }

      85%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    /* Mode 2: CMY Chromatic Split */
    .glitch-word.glitch-cmy {
      animation: g-cmy-base 420ms steps(1, end) forwards;
    }

    .glitch-word.glitch-cmy::before {
      color: #00f0ff;
      mix-blend-mode: screen;
      animation: g-cmy-cyan 420ms steps(1, end) forwards;
    }

    .glitch-word.glitch-cmy::after {
      color: #ff0080;
      mix-blend-mode: screen;
      animation: g-cmy-mag 420ms steps(1, end) forwards;
    }

    @keyframes g-cmy-base {
      0% {
        transform: translate(0, 0);
        text-shadow: 2px 2px 0 #ffe600;
      }

      25% {
        transform: translate(-1.5px, 0.5px) skewX(-4deg);
        text-shadow: -2px 2px 0 #ffe600;
      }

      50% {
        transform: translate(1.5px, -0.5px);
        text-shadow: 2px -1.5px 0 #ffe600;
      }

      75% {
        transform: translate(-0.5px, 0);
        text-shadow: -1.5px 1px 0 #00f0ff, 1.5px -1px 0 #ff0080;
      }

      100% {
        transform: none;
        text-shadow: none;
      }
    }

    @keyframes g-cmy-cyan {
      0% {
        opacity: 0.9;
        transform: translate(-3px, -1.5px);
      }

      25% {
        opacity: 0.95;
        transform: translate(3px, 1px);
      }

      50% {
        opacity: 0.85;
        transform: translate(-2px, 1.5px);
      }

      75% {
        opacity: 0.7;
        transform: translate(-1.5px, 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-cmy-mag {
      0% {
        opacity: 0.9;
        transform: translate(3px, 1.5px);
      }

      25% {
        opacity: 0.95;
        transform: translate(-3px, -1px);
      }

      50% {
        opacity: 0.85;
        transform: translate(2.5px, -1.5px);
      }

      75% {
        opacity: 0.7;
        transform: translate(1.5px, 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    /* Mode 3: Comic Halftone + Color Block Burst */
    .glitch-word.glitch-comic {
      animation: g-comic-base 480ms steps(1, end) forwards;
    }

    .glitch-word.glitch-comic::before {
      content: "";
      inset: -4px -6px;
      background-image:
        radial-gradient(#ff0080 1.2px, transparent 1.2px),
        radial-gradient(#00f0ff 1.2px, transparent 1.2px),
        radial-gradient(#ffe600 1px, transparent 1px);
      background-size: 6px 6px, 7px 7px, 5px 5px;
      background-position: 0 0, 3px 2px, 1px 4px;
      mix-blend-mode: screen;
      animation: g-comic-dots 480ms steps(1, end) forwards;
    }

    .glitch-word.glitch-comic::after {
      content: attr(data-text);
      mix-blend-mode: screen;
      animation: g-comic-block 480ms steps(1, end) forwards;
    }

    @keyframes g-comic-base {
      0% {
        transform: skewX(-8deg);
        text-shadow: -3px -2px 0 #ff0080, 3px 2px 0 #00f0ff;
      }

      22% {
        transform: translate(2px, -1px) skewX(6deg);
        text-shadow: 2px 2px 0 #ffe600, -2px -1px 0 #00f0ff;
      }

      48% {
        background: linear-gradient(115deg, #22c55e 0 36%, #3b82f6 36% 68%, #f97316 68% 100%);
        color: #000000;
        padding: 0 3px;
        margin: 0 -3px;
        transform: skewX(-10deg) scale(1.03);
        text-shadow: none;
      }

      72% {
        background: transparent;
        color: var(--fg);
        padding: 0;
        margin: 0;
        transform: translate(-1px, 0);
        text-shadow: -2px 0 0 #00f0ff, 2px 0 0 #ff0080, 0 1.5px 0 #ffe600;
      }

      100% {
        background: transparent;
        color: var(--fg);
        padding: 0;
        margin: 0;
        transform: none;
        text-shadow: none;
      }
    }

    @keyframes g-comic-dots {
      0% {
        opacity: 0.9;
        transform: translate(-2px, 1px);
        clip-path: inset(0 15% 20% 0);
      }

      22% {
        opacity: 1;
        transform: translate(3px, -2px);
        clip-path: inset(10% 0 0 10%);
      }

      48% {
        opacity: 0.45;
        transform: translate(-1px, 2px);
        clip-path: inset(0 0 0 0);
      }

      72%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-comic-block {
      0% {
        opacity: 0.9;
        color: #00f0ff;
        transform: translate(2.5px, -2px);
        clip-path: inset(0 0 50% 0);
      }

      22% {
        opacity: 0.9;
        color: #ff0080;
        transform: translate(-3px, 2px);
        clip-path: inset(45% 0 0 0);
      }

      48% {
        opacity: 0;
      }

      72% {
        opacity: 0.8;
        color: #ffe600;
        transform: translate(1.5px, 1px);
        clip-path: inset(0 0 0 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .glitch-word,
      .glitch-word::before,
      .glitch-word::after {
        animation: none !important;
      }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(229, 169, 60, 0.6);
      animation: pulse 2.2s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    /* Core Content Block */
    .content-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(34px, 5.5vw, 46px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-optical-sizing: auto;
      background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 2px;
    }

    h1 em {
      font-style: italic;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--fg-muted);
      letter-spacing: -0.01em;
      text-align: justify;
    }

    /* Clean Links */
    .links-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      flex-wrap: wrap;
    }

    .link-item .arrow {
      display: inline-block;
      transition: transform 0.2s var(--ease);
    }

    .link-item:hover .arrow {
      transform: translate(2px, -2px);
    }

    .link-item {
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
    }

    .link-item:hover {
      color: var(--fg);
    }

    .copy-btn {
      color: var(--fg);
      font-weight: 500;
    }

    /* Live Clock */
    /*
    .live-clock {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    */

    /* Clean Minimal Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      background: #141417;
      border: 1px solid var(--border-hover);
      color: var(--fg);
      font-size: 12.5px;
      font-family: var(--font-mono);
      padding: 8px 16px;
      border-radius: 99px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
      transition: transform 0.25s var(--ease), opacity 0.25s;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- Meta -->
    <div class="meta-bar">
      <div class="brand" id="brandTrigger">
        <div class="brand-avatar" id="brandAvatar" role="img" aria-label="Manav"></div>
        <span class="brand-name" aria-label="Manav Chaudhari">
          <span class="glitch-word" data-text="Manav">Manav</span>
          <span class="glitch-word" data-text="Chaudhari">Chaudhari</span>
        </span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>in progress</span>
      </div>
    </div>

    <!-- Core Message -->
    <div class="content-block">
      <h1>this site is being built</h1>
      <p>
        i'm currently putting together my new personal website.
        curating projects, writing, and refining the details.
        coming soon.
      </p>
    </div>

    <!-- Links -->
    <div class="links-row">
      <button class="link-item copy-btn" id="copyBtn" type="button" title="Click to copy email">
        <span>hello@manav.here</span>
      </button>

      <a class="link-item" href="https://x.com/manavgpt" target="_blank" rel="noopener">
        <span>twitter</span><span class="arrow">↗</span>
      </a>

      <a class="link-item" href="./web-archive/">
        <span>archive</span><span class="arrow">↗</span>
      </a>

      <!-- <span class="live-clock" id="live-clock" title="Local time (IST)"></span> -->
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toastMsg">Email copied</span>
  </div>

  <script>
    /* 8-Way Sprite Swap (Cursor Tracking) */
    (function () {
      const avatar = document.getElementById("brandAvatar");
      if (!avatar) return;

      // Only activate sprite mode if avatar-sheet.png exists & loads
      const sheet = new Image();
      sheet.onload = () => {
        avatar.classList.add("sprite-ready");
        initTracking();
      };
      sheet.src = "./avatar-sheet.png";

      function initTracking() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        // 3x3 sprite grid positions keyed by 45° sector (-4 to 4)
        const POSITIONS = {
          "0": "100% 50%",   // Right
          "1": "100% 100%",  // Bottom-Right
          "2": "50% 100%",   // Bottom
          "3": "0% 100%",    // Bottom-Left
          "4": "0% 50%",     // Left
          "-4": "0% 50%",     // Left
          "-3": "0% 0%",      // Top-Left
          "-2": "50% 0%",     // Top
          "-1": "100% 0%",    // Top-Right
        };

        const DEADZONE = 28; // px radius around avatar center -> look straight
        let lastPos = "50% 50%";
        let rafId = null;
        let mx = 0;
        let my = 0;

        function setPos(pos) {
          if (pos === lastPos) return;
          avatar.style.backgroundPosition = pos;
          lastPos = pos;
        }

        function update() {
          rafId = null;
          const rect = avatar.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = mx - cx;
          const dy = my - cy;

          if (Math.hypot(dx, dy) < DEADZONE) {
            setPos("50% 50%");
            return;
          }

          const angle = Math.atan2(dy, dx) * (180 / Math.PI);
          const sector = Math.round(angle / 45);
          setPos(POSITIONS[String(sector)] || "50% 50%");
        }

        window.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          mx = e.clientX;
          my = e.clientY;
          if (!rafId) rafId = requestAnimationFrame(update);
        }, { passive: true });

        document.addEventListener("pointerleave", () => setPos("50% 50%"));
      }
    })();

    /* Spider-Verse Intermittent Name Glitch */
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const words = Array.from(document.querySelectorAll(".glitch-word"));
      const trigger = document.getElementById("brandTrigger");
      if (!words.length) return;

      const modes = [
        { cls: "glitch-slice", dur: 380 },
        { cls: "glitch-cmy", dur: 440 },
        { cls: "glitch-comic", dur: 500 },
      ];

      let busy = false;
      let timer = null;

      function fireGlitch(forceBoth) {
        if (busy || document.hidden) return;
        busy = true;

        const mode = modes[Math.floor(Math.random() * modes.length)];
        let targets;

        if (forceBoth) {
          targets = words;
        } else {
          const roll = Math.random();
          if (roll < 0.38) targets = [words[0]];       // Manav only
          else if (roll < 0.76) targets = [words[1]];  // Chaudhari only
          else targets = words;                        // Full name
        }

        targets.forEach((el) => {
          el.classList.remove("glitch-slice", "glitch-cmy", "glitch-comic");
          void el.offsetWidth;
          el.classList.add(mode.cls);
        });

        setTimeout(() => {
          targets.forEach((el) => el.classList.remove(mode.cls));
          busy = false;
        }, mode.dur);
      }

      function scheduleNext() {
        clearTimeout(timer);
        const delay = 3000 + Math.random() * 3500;
        timer = setTimeout(() => {
          fireGlitch(false);
          scheduleNext();
        }, delay);
      }

      setTimeout(() => {
        fireGlitch(true);
        scheduleNext();
      }, 1400);

      if (trigger) {
        trigger.addEventListener("mouseenter", () => fireGlitch(false));
      }
    })();

    /* Inactivity Tab Flip */
    const favicon = document.getElementById("favicon");
    const inactiveMessages = [
      "where'd you go?",
      "still there?",
      "multitasking, huh?",
      "hello???",
      "well, that was quick",
      "off exploring?",
    ];

    let messageIndex = 0;
    let inactiveInterval = null;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (favicon) favicon.href = "./inactive.png?v=14";
        messageIndex = 0;
        document.title = inactiveMessages[messageIndex];

        clearInterval(inactiveInterval);
        inactiveInterval = setInterval(() => {
          messageIndex = (messageIndex + 1) % inactiveMessages.length;
          document.title = inactiveMessages[messageIndex];
        }, 2700);
      } else {
        if (favicon) favicon.href = "./active.png?v=14";
        clearInterval(inactiveInterval);
        inactiveInterval = null;
        document.title = "finally, you found me!";
      }
    });

    /* Copy Email */
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");
    let toastTimer = null;

    function showToast(msg) {
      if (!toast) return;
      toastMsg.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    const email = "hello@manav.here";
    copyBtn.addEventListener("click", () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(() => {
          showToast(`Copied ${email}`);
        }).catch(() => fallbackPrompt());
      } else {
        fallbackPrompt();
      }
    });

    function fallbackPrompt() {
      showToast(email);
    }
  </script>
</body>

</html>
