<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manav Chaudhari</title>
  <meta name="description" content="Manav Chaudhari — Currently building my new portfolio.">
  <meta name="theme-color" content="#000000">

  <!-- Favicons -->
  <link id="favicon" rel="icon" type="image/png" sizes="192x192" href="images/active.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/active.png?v=14">
  <link rel="preload" as="image" href="images/inactive.png?v=14">
  <link rel="preload" as="image" href="images/avatar-sheet.png">

  <link rel="preload" as="image" href="images/dizzy.png">
  <link rel="preload" as="image" href="images/poked.png">


  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card-bg: #0A0A0C;
      --surface-elevated: #141417;
      --hover-fill: rgba(255, 255, 255, 0.065);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);

      --fg: #EDEDED;
      --fg-muted: #888888;
      --fg-faint: #444444;

      --accent: #E5A93C;

      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", monospace;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    :root[data-theme="light"] {
      --bg: #F8F7F4;
      --card-bg: #FFFFFF;
      --surface-elevated: #FFFFFF;
      --hover-fill: rgba(17, 17, 20, 0.055);
      --border: rgba(17, 17, 20, 0.09);
      --border-hover: rgba(17, 17, 20, 0.18);

      --fg: #141417;
      --fg-muted: #5F5F68;
      --fg-faint: #92929C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Clean Blur-Fade Theme Transition */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
    }

    ::view-transition-old(root) {
      animation: theme-blur-out 420ms ease-in-out both;
    }

    ::view-transition-new(root) {
      animation: theme-blur-in 420ms ease-in-out both;
    }

    @keyframes theme-blur-out {
      from {
        opacity: 1;
        filter: blur(0px);
      }

      to {
        opacity: 0;
        filter: blur(10px);
      }
    }

    @keyframes theme-blur-in {
      from {
        opacity: 0;
        filter: blur(10px);
      }

      to {
        opacity: 1;
        filter: blur(0px);
      }
    }

    .view-hidden {
      display: none !important;
    }

    /* Centered Minimalist Unit */
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* Meta Bar */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 13.5px;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      font-weight: 500;
      cursor: default;
    }

    /* 8-Way Sprite Avatar + Easter Egg Pill */
    .avatar-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      background-color: transparent;
      background-image: url("images/idle.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.2s var(--ease), filter 0.2s var(--ease);
    }

    :root[data-theme="light"] .brand-avatar {
      filter: drop-shadow(0 3px 8px rgba(17, 17, 20, 0.14));
    }

    .brand-avatar.sprite-ready {
      background-image: url("images/avatar-sheet.png");
      background-size: 300% 300%;
      background-position: 50% 50%;
    }

    /* Reaction overrides */
    .brand-avatar.is-reacting {
      background-size: 88% !important;
      background-position: center !important;
      border-color: var(--accent);
    }

    .brand-avatar.is-dizzy {
      background-image: url("images/dizzy.png") !important;
      animation: avatar-dizzy 520ms ease-in-out;
    }

    .brand-avatar.is-annoyed {
      background-image: url("images/poked.png") !important;
      animation: avatar-shake 360ms ease-in-out;
    }

    @keyframes avatar-dizzy {
      0% {
        transform: rotate(0deg) scale(1);
      }

      20% {
        transform: rotate(-14deg) scale(1.06);
      }

      45% {
        transform: rotate(12deg) scale(1.04);
      }

      70% {
        transform: rotate(-7deg) scale(1.02);
      }

      88% {
        transform: rotate(4deg) scale(1);
      }

      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes avatar-shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-3px) rotate(-4deg);
      }

      40% {
        transform: translateX(3px) rotate(4deg);
      }

      60% {
        transform: translateX(-2px) rotate(-2deg);
      }

      80% {
        transform: translateX(2px) rotate(2deg);
      }
    }

    .avatar-pill {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px) scale(0.95);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      background: var(--surface-elevated);
      border: 1px solid var(--border-hover);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border-radius: 99px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: opacity 0.2s var(--ease), transform 0.22s var(--ease);
      z-index: 20;
    }

    .avatar-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Spider-Verse Name Glitch Effect */
    .brand-name {
      font-family: Inter;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      position: relative;
    }

    .glitch-word {
      position: relative;
      display: inline-block;
      will-change: transform, filter;
    }

    .glitch-word::before,
    .glitch-word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    /* Mode 1: Horizontal Slice Shear + CMY Ghost */
    .glitch-word.glitch-slice {
      color: transparent;
      animation: g-slice-base 360ms steps(1, end) forwards;
    }

    .glitch-word.glitch-slice::before {
      color: var(--fg);
      opacity: 1;
      clip-path: inset(0 0 48% 0);
      animation: g-slice-top 360ms steps(1, end) forwards;
    }

    .glitch-word.glitch-slice::after {
      color: var(--fg);
      opacity: 1;
      clip-path: inset(52% 0 0 0);
      animation: g-slice-bot 360ms steps(1, end) forwards;
    }

    @keyframes g-slice-base {

      0%,
      45% {
        color: transparent;
      }

      55% {
        color: var(--fg);
        text-shadow: -2.5px 1px 0 #00f0ff, 2.5px -1px 0 #ff0080, 0 2px 0 #ffe600;
      }

      80% {
        color: var(--fg);
        text-shadow: 1.5px -1px 0 #00f0ff, -1.5px 1px 0 #ff0080;
      }

      100% {
        color: var(--fg);
        text-shadow: none;
      }
    }

    @keyframes g-slice-top {
      0% {
        transform: translate(-3px, -1.5px);
        color: var(--fg);
        opacity: 1;
      }

      30% {
        transform: translate(2.5px, -1px) skewX(-6deg);
        color: #00f0ff;
        opacity: 1;
      }

      55% {
        transform: translate(-2px, 1px);
        color: #ff0080;
        opacity: 0.85;
        clip-path: inset(0 0 0 0);
        mix-blend-mode: screen;
      }

      85%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-slice-bot {
      0% {
        transform: translate(3.5px, 1.5px);
        color: var(--fg);
        opacity: 1;
      }

      30% {
        transform: translate(-2.5px, 1px) skewX(6deg);
        color: #ffe600;
        opacity: 1;
      }

      55% {
        transform: translate(2px, -1px);
        color: #00f0ff;
        opacity: 0.85;
        clip-path: inset(0 0 0 0);
        mix-blend-mode: screen;
      }

      85%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    /* Mode 2: CMY Chromatic Split */
    .glitch-word.glitch-cmy {
      animation: g-cmy-base 420ms steps(1, end) forwards;
    }

    .glitch-word.glitch-cmy::before {
      color: #00f0ff;
      mix-blend-mode: screen;
      animation: g-cmy-cyan 420ms steps(1, end) forwards;
    }

    .glitch-word.glitch-cmy::after {
      color: #ff0080;
      mix-blend-mode: screen;
      animation: g-cmy-mag 420ms steps(1, end) forwards;
    }

    @keyframes g-cmy-base {
      0% {
        transform: translate(0, 0);
        text-shadow: 2px 2px 0 #ffe600;
      }

      25% {
        transform: translate(-1.5px, 0.5px) skewX(-4deg);
        text-shadow: -2px 2px 0 #ffe600;
      }

      50% {
        transform: translate(1.5px, -0.5px);
        text-shadow: 2px -1.5px 0 #ffe600;
      }

      75% {
        transform: translate(-0.5px, 0);
        text-shadow: -1.5px 1px 0 #00f0ff, 1.5px -1px 0 #ff0080;
      }

      100% {
        transform: none;
        text-shadow: none;
      }
    }

    @keyframes g-cmy-cyan {
      0% {
        opacity: 0.9;
        transform: translate(-3px, -1.5px);
      }

      25% {
        opacity: 0.95;
        transform: translate(3px, 1px);
      }

      50% {
        opacity: 0.85;
        transform: translate(-2px, 1.5px);
      }

      75% {
        opacity: 0.7;
        transform: translate(-1.5px, 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-cmy-mag {
      0% {
        opacity: 0.9;
        transform: translate(3px, 1.5px);
      }

      25% {
        opacity: 0.95;
        transform: translate(-3px, -1px);
      }

      50% {
        opacity: 0.85;
        transform: translate(2.5px, -1.5px);
      }

      75% {
        opacity: 0.7;
        transform: translate(1.5px, 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    /* Mode 3: Comic Halftone + Color Block Burst */
    .glitch-word.glitch-comic {
      animation: g-comic-base 480ms steps(1, end) forwards;
    }

    .glitch-word.glitch-comic::before {
      content: "";
      inset: -4px -6px;
      background-image:
        radial-gradient(#ff0080 1.2px, transparent 1.2px),
        radial-gradient(#00f0ff 1.2px, transparent 1.2px),
        radial-gradient(#ffe600 1px, transparent 1px);
      background-size: 6px 6px, 7px 7px, 5px 5px;
      background-position: 0 0, 3px 2px, 1px 4px;
      mix-blend-mode: screen;
      animation: g-comic-dots 480ms steps(1, end) forwards;
    }

    .glitch-word.glitch-comic::after {
      content: attr(data-text);
      mix-blend-mode: screen;
      animation: g-comic-block 480ms steps(1, end) forwards;
    }

    @keyframes g-comic-base {
      0% {
        transform: skewX(-8deg);
        text-shadow: -3px -2px 0 #ff0080, 3px 2px 0 #00f0ff;
      }

      22% {
        transform: translate(2px, -1px) skewX(6deg);
        text-shadow: 2px 2px 0 #ffe600, -2px -1px 0 #00f0ff;
      }

      48% {
        background: linear-gradient(115deg, #22c55e 0 36%, #3b82f6 36% 68%, #f97316 68% 100%);
        color: #000000;
        padding: 0 3px;
        margin: 0 -3px;
        transform: skewX(-10deg) scale(1.03);
        text-shadow: none;
      }

      72% {
        background: transparent;
        color: var(--fg);
        padding: 0;
        margin: 0;
        transform: translate(-1px, 0);
        text-shadow: -2px 0 0 #00f0ff, 2px 0 0 #ff0080, 0 1.5px 0 #ffe600;
      }

      100% {
        background: transparent;
        color: var(--fg);
        padding: 0;
        margin: 0;
        transform: none;
        text-shadow: none;
      }
    }

    @keyframes g-comic-dots {
      0% {
        opacity: 0.9;
        transform: translate(-2px, 1px);
        clip-path: inset(0 15% 20% 0);
      }

      22% {
        opacity: 1;
        transform: translate(3px, -2px);
        clip-path: inset(10% 0 0 10%);
      }

      48% {
        opacity: 0.45;
        transform: translate(-1px, 2px);
        clip-path: inset(0 0 0 0);
      }

      72%,
      100% {
        opacity: 0;
        transform: none;
      }
    }

    @keyframes g-comic-block {
      0% {
        opacity: 0.9;
        color: #00f0ff;
        transform: translate(2.5px, -2px);
        clip-path: inset(0 0 50% 0);
      }

      22% {
        opacity: 0.9;
        color: #ff0080;
        transform: translate(-3px, 2px);
        clip-path: inset(45% 0 0 0);
      }

      48% {
        opacity: 0;
      }

      72% {
        opacity: 0.8;
        color: #ffe600;
        transform: translate(1.5px, 1px);
        clip-path: inset(0 0 0 0);
      }

      100% {
        opacity: 0;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .brand-avatar.is-dizzy,
      .brand-avatar.is-annoyed,
      .glitch-word,
      .glitch-word::before,
      .glitch-word::after,
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none !important;
      }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(229, 169, 60, 0.6);
      animation: pulse 2.2s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s var(--ease), background 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .theme-toggle-btn:hover {
      color: var(--fg);
      background: var(--hover-fill);
    }

    .theme-toggle-btn:active {
      transform: scale(0.90);
    }

    /* Core Content Block */
    .content-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(34px, 5.5vw, 46px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-optical-sizing: auto;
      background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 2px;
    }

    :root[data-theme="light"] h1 {
      background: linear-gradient(180deg, #0B0B0D 0%, #5F5F68 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 em {
      font-style: italic;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--fg-muted);
      letter-spacing: -0.01em;
      text-align: justify;
    }

    /* Footer / Links Row */
    .links-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      flex-wrap: wrap;
    }

    .footer-location {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 12.5px;
      margin-left: auto;
    }

    .globe-3d {
      display: block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .link-item .arrow {
      display: inline-block;
      transition: transform 0.2s var(--ease);
    }

    .link-item:hover .arrow {
      transform: translate(2px, -2px);
    }

    .link-item {
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
    }

    .link-item svg {
      color: var(--fg-muted);
      flex-shrink: 0;
      transition: color 0.2s var(--ease);
    }

    .link-item:hover svg {
      color: var(--fg);
    }

    .link-item:hover {
      color: var(--fg);
    }

    .copy-btn {
      color: var(--fg);
      font-weight: 500;
    }

    /* Clean Minimal Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      background: var(--surface-elevated);
      border: 1px solid var(--border-hover);
      color: var(--fg);
      font-size: 12.5px;
      font-family: var(--font-mono);
      padding: 8px 16px;
      border-radius: 99px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s var(--ease), opacity 0.25s;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- Meta -->
    <div class="meta-bar">
      <div class="brand" id="brandTrigger">
        <div class="avatar-wrap">
          <div class="brand-avatar" id="brandAvatar" role="img" aria-label="Manav"></div>
          <span class="avatar-pill" id="avatarPill" aria-live="polite"></span>
        </div>
        <span class="brand-name" aria-label="Manav Chaudhari">
          <span class="glitch-word" data-text="Manav">Manav</span>
          <span class="glitch-word" data-text="Chaudhari">Chaudhari</span>
        </span>
      </div>

      <div class="status">
        <!-- <span class="status-dot"></span>
        <span>in progress</span> -->
        <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Toggle light or dark theme"
          title="Toggle light/dark theme">
          <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg id="iconMoon" class="view-hidden" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Core Message -->
    <div class="content-block">
      <h1>this site is being built</h1>
      <p>
        i'm currently putting together my new personal website.
        curating projects, writing, and refining the details.
        coming soon.
      </p>
    </div>

    <!-- Footer / Links -->
    <footer class="links-row">
      <a class="link-item" href="mailto:hello@manav.here">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        <span>mail</span><span class="arrow">↗</span>

  <script>
    /* Clean Blur-Fade Theme Switcher */
    (function () {
      const btn = document.getElementById("themeToggleBtn");
      const iconSun = document.getElementById("iconSun");
      const iconMoon = document.getElementById("iconMoon");
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      const root = document.documentElement;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function syncThemeUI(theme) {
        root.setAttribute("data-theme", theme);
        if (iconSun) iconSun.classList.toggle("view-hidden", theme === "light");
        if (iconMoon) iconMoon.classList.toggle("view-hidden", theme !== "light");
        if (metaTheme) metaTheme.setAttribute("content", theme === "light" ? "#F8F7F4" : "#000000");
      }

      let initialTheme = "dark";
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          initialTheme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          initialTheme = "light";
        }
      } catch (_) { }
      syncThemeUI(initialTheme);

      if (btn) {
        btn.addEventListener("click", () => {
          const current = root.getAttribute("data-theme") === "light" ? "light" : "dark";
          const next = current === "dark" ? "light" : "dark";

          try {
            localStorage.setItem("theme", next);
          } catch (_) { }

          if (reducedMotion || typeof document.startViewTransition !== "function") {
            syncThemeUI(next);
            return;
          }

          document.startViewTransition(() => {
            syncThemeUI(next);
          });
        });
      }
    })();

    /* Shared IST Clock for 3D Globe */
    const skyClock = (function () {
      function getISTDate() {
        const now = new Date();
        const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utcMs + 5.5 * 3600000);
      }

      function getHour() {
        const ist = getISTDate();
        return ist.getHours() + ist.getMinutes() / 60 + ist.getSeconds() / 3600;
      }

      function getLightingState(h) {
        let dayAmount = 0;
        let goldenAmount = 0;

        if (h >= 5 && h < 7.5) {
          const t = (h - 5) / 2.5;
          dayAmount = t;
          goldenAmount = Math.sin(t * Math.PI);
        } else if (h >= 7.5 && h < 16.5) {
          dayAmount = 1;
          goldenAmount = 0;
        } else if (h >= 16.5 && h < 19.5) {
          const t = (h - 16.5) / 3;
          dayAmount = 1 - t;
          goldenAmount = Math.sin(t * Math.PI);
        }

        const sunAngle = ((h - 6) / 12) * Math.PI;
        return { dayAmount, goldenAmount, sunAngle };
      }

      return { getHour, getLightingState };
    })();

    /* WebGL 3D Earth Globe */
    (function () {
      const canvas = document.getElementById("globe3d");
      if (!canvas) return;

      const gl = canvas.getContext("webgl", { alpha: true, antialias: true });
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function createEarthTexture() {
        const texCanvas = document.createElement("canvas");
        texCanvas.width = 256;
        texCanvas.height = 128;
        const tctx = texCanvas.getContext("2d");
        const w = texCanvas.width;
        const h = texCanvas.height;
        const img = tctx.createImageData(w, h);
        const d = img.data;

        function hash(x, y) {
          const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
          return n - Math.floor(n);
        }

        function smoothNoise(x, y) {
          const ix = Math.floor(x);
          const iy = Math.floor(y);
          const fx = x - ix;
          const fy = y - iy;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = hash(ix, iy);
          const b = hash(ix + 1, iy);
          const c = hash(ix, iy + 1);
          const d1 = hash(ix + 1, iy + 1);
          return a + (b - a) * ux + (c - a) * uy + (a - b - c + d1) * ux * uy;
        }

        function fbm(x, y) {
          let val = 0;
          let amp = 0.5;
          let freq = 1;
          for (let i = 0; i < 4; i++) {
            val += amp * smoothNoise(x * freq, y * freq);
            freq *= 2.02;
            amp *= 0.5;
          }
          return val;
        }

        const blobs = [
          { u: 0.22, v: 0.34, ru: 0.11, rv: 0.14 },
          { u: 0.29, v: 0.62, ru: 0.065, rv: 0.18 },
          { u: 0.50, v: 0.26, ru: 0.065, rv: 0.09 },
          { u: 0.52, v: 0.54, ru: 0.08, rv: 0.18 },
          { u: 0.66, v: 0.32, ru: 0.16, rv: 0.14 },
          { u: 0.68, v: 0.45, ru: 0.045, rv: 0.08 },
          { u: 0.79, v: 0.70, ru: 0.07, rv: 0.08 },
        ];

        for (let y = 0; y < h; y++) {
          const v = y / (h - 1);
          const latAbs = Math.abs(v - 0.5) * 2;
          for (let x = 0; x < w; x++) {
            const u = x / (w - 1);
            const idx = (y * w + x) * 4;

            let landMask = 0;
            for (let b = 0; b < blobs.length; b++) {
              const bl = blobs[b];
              let du = Math.abs(u - bl.u);
              if (du > 0.5) du = 1 - du;
              const dv = (v - bl.v) / bl.rv;
              const dist = Math.sqrt((du / bl.ru) ** 2 + dv * dv);
              if (dist < 1.25) {
                landMask = Math.max(landMask, 1 - dist / 1.25);
              }
            }

            const n = fbm(u * 14, v * 7);
            const elevation = landMask * 0.85 + (n - 0.42) * 0.65;

            let rCol, gCol, bCol;
            if (latAbs > 0.86 + (n - 0.5) * 0.08) {
              rCol = 226;
              gCol = 236;
              bCol = 245;
            } else if (elevation > 0.36) {
              const t = Math.min(1, (elevation - 0.36) / 0.45);
              const arid = Math.max(0, 1 - Math.abs(latAbs - 0.28) * 5);
              rCol = Math.round(58 + t * 85 + arid * 55);
              gCol = Math.round(126 + t * 35 - arid * 22);
              bCol = Math.round(68 + t * 20 + arid * 12);
            } else {
              const depth = Math.max(0, Math.min(1, (0.36 - elevation) / 0.36));
              rCol = Math.round(28 - depth * 16);
              gCol = Math.round(118 - depth * 68);
              bCol = Math.round(196 - depth * 92);
            }

            d[idx] = rCol;
            d[idx + 1] = gCol;
            d[idx + 2] = bCol;
            d[idx + 3] = 255;
          }
        }

        tctx.putImageData(img, 0, 0);
        return texCanvas;
      }

      if (!gl) return;

      const vsSource = `
        attribute vec3 aPos;
        attribute vec2 aTex;
        uniform float uRot;
        varying vec2 vTex;
        varying vec3 vNormal;
        void main() {
          float c = cos(uRot);
          float s = sin(uRot);
          vec3 rotPos = vec3(
            aPos.x * c + aPos.z * s,
            aPos.y,
            -aPos.x * s + aPos.z * c
          );
          vTex = aTex;
          vNormal = normalize(rotPos);
          gl_Position = vec4(rotPos.xy, -rotPos.z * 0.5, 1.0);
        }
      `;

      const fsSource = `
        precision mediump float;
        uniform sampler2D uTex;
        uniform vec3 uLightDir;
        uniform float uAmbient;
        uniform float uSpecStrength;
        uniform vec3 uLightTint;
        varying vec2 vTex;
        varying vec3 vNormal;
        void main() {
          vec3 texCol = texture2D(uTex, vTex).rgb;
          vec3 n = normalize(vNormal);
          float diff = max(0.0, dot(n, normalize(uLightDir)));
          vec3 viewDir = vec3(0.0, 0.0, 1.0);
          vec3 halfVec = normalize(normalize(uLightDir) + viewDir);
          float spec = pow(max(0.0, dot(n, halfVec)), 22.0) * uSpecStrength;
          vec3 lit = texCol * (uAmbient + diff * 0.85) * uLightTint + vec3(spec) * uLightTint;
          gl_FragColor = vec4(lit, 1.0);
        }
      `;

      function compileShader(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        return sh;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const latSegs = 24;
      const lonSegs = 36;
      const positions = [];
      const texCoords = [];
      const indices = [];

      for (let y = 0; y <= latSegs; y++) {
        const v = y / latSegs;
        const phi = v * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        for (let x = 0; x <= lonSegs; x++) {
          const u = x / lonSegs;
          const theta = u * Math.PI * 2;
          const px = sinPhi * Math.cos(theta);
          const py = cosPhi;
          const pz = sinPhi * Math.sin(theta);

          positions.push(px * 0.96, py * 0.96, pz * 0.96);
          texCoords.push(1.0 - u, 1.0 - v);
        }
      }

      for (let y = 0; y < latSegs; y++) {
        for (let x = 0; x < lonSegs; x++) {
          const a = y * (lonSegs + 1) + x;
          const b = a + lonSegs + 1;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const posBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      const texBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, texBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(texCoords), gl.STATIC_DRAW);
      const aTex = gl.getAttribLocation(prog, "aTex");
      gl.enableVertexAttribArray(aTex);
      gl.vertexAttribPointer(aTex, 2, gl.FLOAT, false, 0, 0);

      const idxBuf = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, createEarthTexture());
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      const uRot = gl.getUniformLocation(prog, "uRot");
      const uLightDir = gl.getUniformLocation(prog, "uLightDir");
      const uAmbient = gl.getUniformLocation(prog, "uAmbient");
      const uSpecStrength = gl.getUniformLocation(prog, "uSpecStrength");
      const uLightTint = gl.getUniformLocation(prog, "uLightTint");

      gl.enable(gl.DEPTH_TEST);
      gl.viewport(0, 0, canvas.width, canvas.height);

      let rot = 0.6;

      function draw() {
        const h = skyClock.getHour();
        const { dayAmount, goldenAmount, sunAngle } = skyClock.getLightingState(h);

        const lx = -Math.cos(sunAngle) * 0.72;
        const ly = 0.25 + Math.max(0, Math.sin(sunAngle)) * 0.45;
        const lz = 0.55 + dayAmount * 0.25;

        const ambient = 0.14 + dayAmount * 0.22;
        const spec = 0.12 + dayAmount * 0.28;

        const nightTint = [0.68, 0.78, 1.05];
        const dayTint = [1.05, 1.04, 1.0];
        const goldenTint = [1.22, 0.92, 0.74];

        const baseR = nightTint[0] + (dayTint[0] - nightTint[0]) * dayAmount;
        const baseG = nightTint[1] + (dayTint[1] - nightTint[1]) * dayAmount;
        const baseB = nightTint[2] + (dayTint[2] - nightTint[2]) * dayAmount;

        const tintR = baseR + (goldenTint[0] - baseR) * goldenAmount * 0.75;
        const tintG = baseG + (goldenTint[1] - baseG) * goldenAmount * 0.75;
        const tintB = baseB + (goldenTint[2] - baseB) * goldenAmount * 0.75;

        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniform1f(uRot, rot);
        gl.uniform3f(uLightDir, lx, ly, lz);
        gl.uniform1f(uAmbient, ambient);
        gl.uniform1f(uSpecStrength, spec);
        gl.uniform3f(uLightTint, tintR, tintG, tintB);
        gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
      }

      function loop() {
        if (!document.hidden) {
          if (!reducedMotion) {
            rot = (rot + 0.025) % (Math.PI * 2);
          }
          draw();
        }
        requestAnimationFrame(loop);
      }

      draw();
      requestAnimationFrame(loop);
    })();

    /* 8-Way Sprite Swap + Dizzy / Annoyed Easter Egg */
    (function () {
      const avatar = document.getElementById("brandAvatar");
      const pill = document.getElementById("avatarPill");
      if (!avatar) return;

      const DIZZY_LINES = ["dizzy", "whoa", "chill", "easy there", "i can hear sounds", "who am i??"];
      const ANNOYED_LINES = ["i'm down", "stop poking", "really?", "bruh!", "my eyes", "bro, i'm literally dead", "turned into a ghost"];

      let isReacting = false;
      let reactTimer = null;
      let lastAngle = null;
      let spinAccum = 0;
      let spinDecayTimer = null;
      let clickCount = 0;
      let clickResetTimer = null;

      function triggerReaction(type) {
        if (isReacting) return;
        isReacting = true;
        spinAccum = 0;
        lastAngle = null;
        clickCount = 0;

        const lines = type === "dizzy" ? DIZZY_LINES : ANNOYED_LINES;
        const msg = lines[Math.floor(Math.random() * lines.length)];

        avatar.classList.remove("is-dizzy", "is-annoyed");
        void avatar.offsetWidth;
        avatar.classList.add("is-reacting", type === "dizzy" ? "is-dizzy" : "is-annoyed");

        if (pill) {
          pill.textContent = msg;
          pill.classList.add("show");
        }

        clearTimeout(reactTimer);
        reactTimer = setTimeout(() => {
          avatar.classList.remove("is-reacting", "is-dizzy", "is-annoyed");
          if (pill) pill.classList.remove("show");
          isReacting = false;
        }, 2200);
      }

      avatar.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isReacting) return;

        clickCount += 1;
        clearTimeout(clickResetTimer);

        if (clickCount >= 2) {
          triggerReaction("annoyed");
        } else {
          clickResetTimer = setTimeout(() => {
            clickCount = 0;
          }, 1100);
        }
      });

      const sheet = new Image();
      sheet.onload = () => {
        avatar.classList.add("sprite-ready");
        initTracking();
      };
      sheet.src = "images/avatar-sheet.png";

      function initTracking() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const POSITIONS = {
          "0": "100% 50%",
          "1": "100% 100%",
          "2": "50% 100%",
          "3": "0% 100%",
          "4": "0% 50%",
          "-4": "0% 50%",
          "-3": "0% 0%",
          "-2": "50% 0%",
          "-1": "100% 0%",
        };

        const DEADZONE = 28;
        let lastPos = "50% 50%";
        let rafId = null;
        let mx = 0;
        let my = 0;

        function setPos(pos) {
          if (pos === lastPos) return;
          avatar.style.backgroundPosition = pos;
          lastPos = pos;
        }

        function update() {
          rafId = null;
          if (isReacting) return;

          const rect = avatar.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = mx - cx;
          const dy = my - cy;

          if (Math.hypot(dx, dy) < DEADZONE) {
            setPos("50% 50%");
            lastAngle = null;
            return;
          }

          const angle = Math.atan2(dy, dx) * (180 / Math.PI);
          const sector = Math.round(angle / 45);
          setPos(POSITIONS[String(sector)] || "50% 50%");

          if (lastAngle !== null) {
            let delta = angle - lastAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            spinAccum += Math.abs(delta);
            clearTimeout(spinDecayTimer);
            spinDecayTimer = setTimeout(() => {
              spinAccum = 0;
              lastAngle = null;
            }, 650);

            if (spinAccum >= 900) {
              triggerReaction("dizzy");
              return;
            }
          }
          lastAngle = angle;
        }

        window.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          mx = e.clientX;
          my = e.clientY;
          if (!rafId) rafId = requestAnimationFrame(update);
        }, { passive: true });

        document.addEventListener("pointerleave", () => {
          lastAngle = null;
          spinAccum = 0;
          if (!isReacting) setPos("50% 50%");
        });
      }
    })();

    /* Spider-Verse Intermittent Name Glitch */
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const words = Array.from(document.querySelectorAll(".glitch-word"));
      const trigger = document.getElementById("brandTrigger");
      if (!words.length) return;

      const modes = [
        { cls: "glitch-slice", dur: 380 },
        { cls: "glitch-cmy", dur: 440 },
        { cls: "glitch-comic", dur: 500 },
      ];

      let busy = false;
      let timer = null;

      function fireGlitch(forceBoth) {
        if (busy || document.hidden) return;
        busy = true;

        const mode = modes[Math.floor(Math.random() * modes.length)];
        let targets;

        if (forceBoth) {
          targets = words;
        } else {
          const roll = Math.random();
          if (roll < 0.38) targets = [words[0]];
          else if (roll < 0.76) targets = [words[1]];
          else targets = words;
        }

        targets.forEach((el) => {
          el.classList.remove("glitch-slice", "glitch-cmy", "glitch-comic");
          void el.offsetWidth;
          el.classList.add(mode.cls);
        });

        setTimeout(() => {
          targets.forEach((el) => el.classList.remove(mode.cls));
          busy = false;
        }, mode.dur);
      }

      function scheduleNext() {
        clearTimeout(timer);
        const delay = 3000 + Math.random() * 3500;
        timer = setTimeout(() => {
          fireGlitch(false);
          scheduleNext();
        }, delay);
      }

      setTimeout(() => {
        fireGlitch(true);
        scheduleNext();
      }, 1400);

      if (trigger) {
        trigger.addEventListener("mouseenter", () => fireGlitch(false));
      }
    })();

    /* Inactivity Tab Flip */
    const favicon = document.getElementById("favicon");
    const inactiveMessages = [
      "where'd you go?",
      "still there?",
      "multitasking, huh?",
      "hello???",
      "well, that was quick",
      "off exploring?",
    ];

    let messageIndex = 0;
    let inactiveInterval = null;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (favicon) favicon.href = "images/inactive.png";
        messageIndex = 0;
        document.title = inactiveMessages[messageIndex];

        clearInterval(inactiveInterval);
        inactiveInterval = setInterval(() => {
          messageIndex = (messageIndex + 1) % inactiveMessages.length;
          document.title = inactiveMessages[messageIndex];
        }, 2700);
      } else {
        if (favicon) favicon.href = "images/active.png";
        clearInterval(inactiveInterval);
        inactiveInterval = null;
        document.title = "finally, you found me!";
      }
    });

    /* Copy Email */
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");
    let toastTimer = null;

    function showToast(msg) {
      if (!toast) return;
      toastMsg.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    const email = "hello@manav.here";
    copyBtn.addEventListener("click", () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(() => {
          showToast(`Copied ${email}`);
        }).catch(() => fallbackPrompt());
      } else {
        fallbackPrompt();
      }
    });

    function fallbackPrompt() {
      showToast(email);
    }
  </script>
